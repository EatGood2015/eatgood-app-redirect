<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Open the Eat Good app</title>
    <meta name="description" content="Redirecting to the Eat Good app store.">
    <script>
      // Store URLs
      const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.splend.eatgoodcomappegy&hl=en";
      const IOS_URL = "https://apps.apple.com/de/app/eat-good/id6787993739";

      // Basic device detection
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

      // Redirect immediately on mobile devices
      if (isAndroid && ANDROID_URL) {
        window.location.replace(ANDROID_URL);
      } else if (isIOS && IOS_URL) {
        window.location.replace(IOS_URL);
      } else {
        // Otherwise show the fallback landing page
        window.addEventListener("DOMContentLoaded", () => {
          const play = document.getElementById("play-link");
          const ios = document.getElementById("ios-link");
          play.href = ANDROID_URL;
          ios.href = IOS_URL;
          document.getElementById("status").textContent = "Tap a link below to open the app store.";
        });
      }
    </script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:#f7f7f7; color:#111; }
      .card { max-width:540px; width:94%; background:#fff; padding:28px; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.08); text-align:center; }
      h1 { margin:0 0 8px; font-size:20px; }
      p { margin:0 0 18px; color:#444; }
      .buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
      .btn { display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; text-decoration:none; color:#fff; font-weight:600; font-size:15px; }
      .android { background:#3DDC84; }
      .ios { background:#0070C9; }
      .icon { width:20px; height:20px; display:inline-block; }
      small { display:block; margin-top:14px; color:#888; }

      /* Make buttons a bit larger on mobile devices */
      @media (max-width:480px){
        .btn{padding:12px 16px;font-size:16px}
        .icon{width:22px;height:22px}
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening the Eat Good app…</h1>
      <p id="status">Detecting your device and redirecting you to the correct app store.</p>
      <div class="buttons" aria-hidden="false">
        <a id="play-link" class="btn android" href="#" role="link" aria-label="Get it on Google Play">
          <!-- Simple Google Play style triangle icon -->
          <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M3.6 2.2 17.3 12 3.6 21.8z" fill="#00C853"></path>
            <path d="M3.6 2.2 14.6 9.7 17.3 12 14.6 14.3z" fill="#FFD400"></path>
            <path d="M14.6 14.3 3.6 21.8 14.6 9.7z" fill="#FF3D00"></path>
            <path d="M17.3 12 14.6 9.7 14.6 14.3z" fill="#3D5AFE"></path>
          </svg>
          <span>Get it on Google Play</span>
        </a>

        <a id="ios-link" class="btn ios" href="#" role="link" aria-label="Download on the App Store">
          <!-- Simple Apple logo icon -->
          <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path fill="#fff" d="M16.365 1.43c-.98.06-2.17.63-2.86 1.38-.62.66-1.16 1.85-1.01 2.94 1.07.04 2.23-.6 2.92-1.33.64-.69 1.11-1.85.95-2.99zM20.5 7.5c-.9.04-2.05.6-2.73 1.34-.6.66-1.13 1.84-.98 2.93 1.1.04 2.26-.6 2.95-1.33.63-.69 1.11-1.86.76-2.94zM20.8 12.8c-.05-1.47-.93-3.1-2.21-4.13-1.02-.86-2.5-1.1-3.83-.66-.69.24-1.63.56-2.45.56-.8 0-1.7-.3-2.45-.56-1.33-.44-2.8-.2-3.83.66-1.28 1.03-2.16 2.66-2.21 4.13-.05 1.57.43 3.25 1.34 4.58.78 1.14 1.98 2.04 3.43 2.04.74 0 1.28-.22 2.01-.22.75 0 1.26.22 2.02.22 1.46 0 2.66-.9 3.44-2.04.91-1.33 1.39-3.01 1.34-4.58z"/>
          </svg>
          <span>Download on the App Store</span>
        </a>
      </div>
      <small>If you are not redirected automatically, tap the appropriate button above.</small>
    </div>
  </body>
</html>
